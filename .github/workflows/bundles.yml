# Pieza reutilizable del pipeline (ADR-27): el orden y las condiciones viven en main.yml y pr.yml.
# X2 · Asset Bundles de datos (data/). Cada carpeta con databricks.yml es un bundle.
# PR: validate. Push a main: deploy al target de producción, que corre como sp-pipelines (run_as),
# y copia de policy_docs, policy/catalog.yaml (E5) y los snapshots de tasas (E6) a los volúmenes de ref.
# Sin aprobación de environment: a main solo llega lo que Nicolle mergea.
name: bundles
on:
  # Lo llama main.yml/pr.yml (ADR-27); workflow_dispatch queda para correrlo a mano.
  workflow_call:
  workflow_dispatch:

permissions: { contents: read, id-token: write }

env:
  # El SP del pipeline entra al workspace como admin y tiene servicePrincipal.user sobre sp-pipelines.
  DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
  DATABRICKS_AUTH_TYPE: github-oidc-azure
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  BUNDLE_TARGET: ${{ vars.BUNDLE_TARGET || 'prod' }}

jobs:
  bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: validate / deploy
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find data -name databricks.yml -not -path '*/.databricks/*' -exec dirname {} \; | sort)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::notice::No hay bundles en data/ todavía."
            exit 0
          fi
          for d in "${dirs[@]}"; do
            echo "::group::$d"
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              (cd "$d" && databricks bundle validate -t "$BUNDLE_TARGET")
            else
              (cd "$d" && databricks bundle deploy -t "$BUNDLE_TARGET")
            fi
            echo "::endgroup::"
          done

      # Insumos de ref (ADR-21 v1.2): el repo es la fuente de verdad y los volúmenes son la copia que
      # leen E7 (chunks de policy_docs) y E5 + el motor de reglas (catalog.yaml). Solo en main.
      - name: copiar insumos a volúmenes de ref
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ -d data/policy_docs/docs ]; then
            databricks fs cp -r data/policy_docs/docs/ dbfs:/Volumes/hackathon/ref/policy_docs/ --overwrite
            databricks fs ls dbfs:/Volumes/hackathon/ref/policy_docs/
          else
            echo "::notice::Sin data/policy_docs/docs todavía."
          fi
          databricks fs cp policy/catalog.yaml dbfs:/Volumes/hackathon/ref/fuentes/catalog.yaml --overwrite
          # E6: los snapshots de tasas de regulador. Se copian todos y conviven a propósito: una
          # respuesta citada en octubre tiene que poder reproducirse con la tasa de octubre.
          for f in data/ref/regulator_rates_*.csv; do
            [ -e "$f" ] || continue
            databricks fs cp "$f" "dbfs:/Volumes/hackathon/ref/fuentes/$(basename "$f")" --overwrite
          done
