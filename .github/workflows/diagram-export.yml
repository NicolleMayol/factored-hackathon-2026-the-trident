# Pieza reutilizable del pipeline (ADR-27): la llama main.yml cuando cambia un .drawio.
# Exporta los PNG y los sube a main con la GitHub App del equipo (diagram bot), que está en la lista de
# bypass del ruleset de main. GITHUB_TOKEN no puede saltarse la protección; la App sí, con permiso
# contents: write en este repo y un token que dura 1 hora. El commit lleva [skip ci]: no dispara nada.
name: diagram-export
on:
  workflow_call:
  workflow_dispatch:

permissions: { contents: read }

jobs:
  export:
    runs-on: ubuntu-latest
    # El environment guarda la llave de la App y solo acepta la rama main.
    environment: diagrams
    concurrency: { group: diagram-export, cancel-in-progress: true }
    steps:
      - name: Token de la App
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.DIAGRAM_BOT_APP_ID }}
          private-key: ${{ secrets.DIAGRAM_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          ref: main
      - name: Exportar PNG
        uses: rlespinasse/drawio-export-action@v2
        with:
          path: diagrams
          format: png
          output: out
          transparent: false
          scale: 2
          action-mode: all
      - name: Subir exportes a main
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
          git add diagrams/out
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "chore(diagrams): export [skip ci]"
          git pull --rebase -q origin main   # por si entró otro merge mientras exportaba
          git push origin HEAD:main
