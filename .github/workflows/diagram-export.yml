# Pieza reutilizable del pipeline (ADR-27): el orden y las condiciones viven en main.yml.
# Diagrama de arquitectura · main: exporta los PNG una vez, al mergear, y los sube con [skip ci].
name: diagram-export
on:
  # Lo llama main.yml (ADR-27); workflow_dispatch queda para correrlo a mano.
  workflow_call:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    concurrency: { group: diagram-export, cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4
      - name: Exportar PNG
        uses: rlespinasse/drawio-export-action@v2
        with:
          path: diagrams
          format: png
          output: out
          transparent: false
          scale: 2
          action-mode: all
      - name: Subir exportes a main
        run: |
          git config user.name "diagram-bot"; git config user.email "bot@users.noreply.github.com"
          git add diagrams/out
          if git diff --cached --quiet; then echo "sin cambios"; else git commit -m "chore(diagrams): export [skip ci]" && git push; fi
