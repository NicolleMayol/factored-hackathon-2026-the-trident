# Pieza reutilizable del pipeline (ADR-27): el orden y las condiciones viven en main.yml y pr.yml.
# Dos stacks en orden: infra/azure (recursos de Azure) y luego infra/databricks (Unity Catalog, grants, SPs, warehouse).
name: infra
on:
  # Lo llama main.yml/pr.yml (ADR-27); workflow_dispatch queda para correrlo a mano.
  workflow_call:
  workflow_dispatch:

permissions: { contents: read, pull-requests: write, id-token: write }

env:
  # OIDC: GitHub entrega un token de corta duración; Entra lo cambia por uno del SP (credenciales federadas).
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_VAR_budget_amount: ${{ vars.BUDGET_AMOUNT || '100' }}
  TF_VAR_budget_emails: ${{ vars.BUDGET_EMAILS || '[]' }}
  TF_VAR_admin_object_ids: ${{ vars.ADMIN_OBJECT_IDS || '[]' }}
  TF_VAR_iaml_object_ids: ${{ vars.IAML_OBJECT_IDS || '[]' }}
  TF_VAR_function_always_ready: ${{ vars.FUNCTION_ALWAYS_READY || 'false' }}
  TF_VAR_databricks_client_id: ${{ vars.DATABRICKS_CLIENT_ID }}
  TF_VAR_sql_http_path: ${{ vars.SQL_HTTP_PATH }}
  TF_VAR_admin_users: ${{ vars.ADMIN_USERS || '[]' }}
  TF_VAR_datos_users: ${{ vars.DATOS_USERS || '[]' }}
  TF_VAR_iaml_users: ${{ vars.IAML_USERS || '[]' }}
  TF_VAR_databricks_account_id: ${{ vars.DATABRICKS_ACCOUNT_ID }}
  TF_VAR_existing_metastore_id: ${{ vars.DATABRICKS_METASTORE_ID }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  STACKS: azure databricks # orden de aplicación
  # El tfplan lleva secretos en claro y el repo es público: no va como artifact de GitHub. Va al
  # storage del tfstate (privado, OIDC) y apply lo baja de ahí.
  TFPLAN_ACCOUNT: sttfstateagentbankdev
  TFPLAN_CONTAINER: tfplan

jobs:
  # PR: plan + comentario. main / manual: plan guardado (tfplan) que apply usa tal cual.
  plan:
    runs-on: ubuntu-latest
    concurrency: { group: terraform-plan, cancel-in-progress: false }
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.16.4", terraform_wrapper: false }
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Backend del estado
        run: bash infra/scripts/ensure-backend.sh
      - name: fmt
        run: terraform fmt -check -recursive infra || echo "::warning::terraform fmt encontró diferencias; corre 'terraform fmt -recursive infra'"
      - name: init + validate + plan
        id: plan
        run: |
          set -o pipefail
          changes=""
          for st in $STACKS; do
            echo "::group::infra/$st"
            cd "infra/$st"
            terraform init && terraform validate
            set +e
            terraform plan -no-color -lock-timeout=5m -detailed-exitcode -out=tfplan | tee plan.txt
            rc=${PIPESTATUS[0]}
            set -e
            case $rc in
              0) ;;                          # sin cambios
              2) changes="$changes $st" ;;   # hay cambios
              *) exit "$rc" ;;
            esac
            cd - >/dev/null
            echo "::endgroup::"
          done
          echo "changes=${changes# }" >> "$GITHUB_OUTPUT"
      - name: Resumen del plan
        if: always()
        run: |
          for st in $STACKS; do
            f="infra/$st/plan.txt"
            echo "## terraform plan · infra/$st"
            echo
            if [ -f "$f" ]; then
              grep -E '^(Plan:|No changes\.)' "$f" || echo "(sin línea de resumen)"
              echo
              echo "<details><summary>Plan completo</summary>"
              echo
              echo '```'
              head -c 30000 "$f"
              echo '```'
              echo "</details>"
            else
              echo "El plan no llegó a correr. Revisa el log del job."
            fi
            echo
          done > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      - uses: marocchino/sticky-pull-request-comment@v2
        if: always() && github.event_name == 'pull_request'
        with: { header: infra-plan, path: comment.md }
      - name: Guardar tfplan
        if: github.event_name != 'pull_request' && steps.plan.outputs.changes != ''
        run: |
          az storage container create -n "$TFPLAN_CONTAINER" --account-name "$TFPLAN_ACCOUNT" --auth-mode login -o none
          for st in ${{ steps.plan.outputs.changes }}; do
            az storage blob upload --auth-mode login --account-name "$TFPLAN_ACCOUNT" -c "$TFPLAN_CONTAINER" \
              -n "$GITHUB_RUN_ID/$st.tfplan" -f "infra/$st/tfplan" --overwrite -o none
          done

  # Aplica el tfplan de este mismo run, sin volver a planear. Si el estado cambió desde el plan,
  # Terraform rechaza el tfplan ("Saved plan is stale") y hay que correr el workflow de nuevo.
  apply:
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.changes != ''
    runs-on: ubuntu-latest
    concurrency: { group: terraform-apply, cancel-in-progress: false }
    environment: hackathon # exige la aprobación de Nicolle; el plan está en el resumen del job plan
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.16.4", terraform_wrapper: false }
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: init + apply del tfplan
        run: |
          for st in ${{ needs.plan.outputs.changes }}; do
            echo "::group::infra/$st"
            cd "infra/$st"
            terraform init
            az storage blob download --auth-mode login --account-name "$TFPLAN_ACCOUNT" -c "$TFPLAN_CONTAINER" \
              -n "$GITHUB_RUN_ID/$st.tfplan" -f tfplan -o none
            terraform apply -lock-timeout=5m tfplan
            cd - >/dev/null
            echo "::endgroup::"
          done
      - name: Borrar tfplan
        if: success()
        run: |
          az storage blob delete-batch --auth-mode login --account-name "$TFPLAN_ACCOUNT" -s "$TFPLAN_CONTAINER" \
            --pattern "$GITHUB_RUN_ID/*" -o none
      - name: Salidas
        if: always()
        run: |
          for st in $STACKS; do
            echo "## infra/$st · salidas" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            (cd "infra/$st" && terraform output 2>/dev/null) >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
