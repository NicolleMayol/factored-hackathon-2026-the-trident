# Mover a .github/workflows/infra.yml (reemplaza el actual).
# Dos stacks en orden: infra/azure (recursos de Azure) y luego infra/databricks (Unity Catalog, grants, SPs, warehouse).
name: infra
on:
  # Solo Terraform y el script del backend: cambios en infra/README.md o en docs no corren plan.
  pull_request:
    paths: ["infra/**/*.tf", "infra/scripts/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**/*.tf", "infra/scripts/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions: { contents: read, pull-requests: write, id-token: write }
concurrency: { group: terraform, cancel-in-progress: false }

env:
  # OIDC: GitHub entrega un token de corta duración; Entra lo cambia por uno del SP (credenciales federadas).
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_VAR_budget_amount: ${{ vars.BUDGET_AMOUNT || '100' }}
  TF_VAR_budget_emails: ${{ vars.BUDGET_EMAILS || '[]' }}
  TF_VAR_admin_object_ids: ${{ vars.ADMIN_OBJECT_IDS || '[]' }}
  TF_VAR_function_always_ready: ${{ vars.FUNCTION_ALWAYS_READY || 'false' }}
  TF_VAR_databricks_client_id: ${{ vars.DATABRICKS_CLIENT_ID }}
  TF_VAR_sql_http_path: ${{ vars.SQL_HTTP_PATH }}
  TF_VAR_admin_users: ${{ vars.ADMIN_USERS || '[]' }}
  TF_VAR_datos_users: ${{ vars.DATOS_USERS || '[]' }}
  TF_VAR_iaml_users: ${{ vars.IAML_USERS || '[]' }}
  TF_VAR_databricks_account_id: ${{ vars.DATABRICKS_ACCOUNT_ID }}
  TF_VAR_existing_metastore_id: ${{ vars.DATABRICKS_METASTORE_ID }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  STACKS: azure databricks # orden de aplicación

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.16.4", terraform_wrapper: false }
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Backend del estado
        run: bash infra/scripts/ensure-backend.sh
      - name: fmt
        run: terraform fmt -check -recursive infra || echo "::warning::terraform fmt encontró diferencias; corre 'terraform fmt -recursive infra'"
      - name: init + validate + plan
        id: plan
        run: |
          set -o pipefail
          for st in $STACKS; do
            echo "::group::infra/$st"
            cd "infra/$st"
            terraform init && terraform validate
            terraform plan -no-color -lock-timeout=5m -out=tfplan | tee plan.txt
            cd - >/dev/null
            echo "::endgroup::"
          done
      - name: Resumen para el PR
        if: always()
        run: |
          for st in $STACKS; do
            f="infra/$st/plan.txt"
            echo "## terraform plan · infra/$st"
            echo
            if [ -f "$f" ]; then
              grep -E '^(Plan:|No changes\.)' "$f" || echo "(sin línea de resumen)"
              echo
              echo "<details><summary>Plan completo</summary>"
              echo
              echo '```'
              head -c 30000 "$f"
              echo '```'
              echo "</details>"
            else
              echo "El plan no llegó a correr. Revisa el log del job."
            fi
            echo
          done > comment.md
      - uses: marocchino/sticky-pull-request-comment@v2
        if: always()
        with: { header: infra-plan, path: comment.md }

  apply:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: hackathon # exige la aprobación de Nicolle
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.16.4", terraform_wrapper: false }
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Backend del estado
        run: bash infra/scripts/ensure-backend.sh
      - name: init + apply
        run: |
          for st in $STACKS; do
            echo "::group::infra/$st"
            cd "infra/$st"
            terraform init
            terraform apply -auto-approve -lock-timeout=5m
            cd - >/dev/null
            echo "::endgroup::"
          done
      - name: Salidas
        if: always()
        run: |
          for st in $STACKS; do
            echo "## infra/$st · salidas" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            (cd "infra/$st" && terraform output 2>/dev/null) >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
