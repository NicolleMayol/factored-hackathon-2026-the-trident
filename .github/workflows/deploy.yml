# Pieza reutilizable del pipeline (ADR-27): el orden y las condiciones viven en main.yml y pr.yml.
# N10 · Despliegue del agente en la Function App (Flex), con OIDC.
# main.yml lo corre cuando cambia el código del agente, después de ci e infra. La UI va aparte (deploy-web.yml):
# un cambio solo de frontend no reconstruye ni reinicia el backend.
name: deploy
on:
  # Lo llama main.yml/pr.yml (ADR-27); workflow_dispatch queda para correrlo a mano.
  workflow_call:
  workflow_dispatch:

permissions: { contents: read, id-token: write }

# Nombres de recursos en variables del repo (Settings → Variables), no en el workflow: otro ambiente
# solo cambia las variables. Valores = outputs de infra/azure (resource_group, function_app_name, chat_url).
env:
  RG: ${{ vars.AZURE_RESOURCE_GROUP }}
  FUNC: ${{ vars.FUNCTION_APP_NAME }}

jobs:
  function:
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.host.outputs.host }}
    steps:
      - uses: actions/checkout@v4
      - name: Variables de recursos
        run: |
          for v in AZURE_RESOURCE_GROUP FUNCTION_APP_NAME; do
            [ -n "${!v:-}" ] || { echo "::error::falta la variable de repo $v"; miss=1; }
          done
          [ -z "${miss:-}" ]
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          FUNCTION_APP_NAME: ${{ vars.FUNCTION_APP_NAME }}
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Raíz del paquete: function_app.py + host.json de deploy/function y lo que el agente lee
      # en runtime (prompts, policy, contratos, mocks). requirements.txt se instala en Azure.
      - name: Armar paquete
        run: |
          set -euo pipefail
          mkdir -p dist/data
          cp deploy/function/function_app.py deploy/function/host.json requirements.txt dist/
          cp -r agent policy contracts dist/
          cp -r data/mock dist/data/
          find dist -name __pycache__ -prune -exec rm -rf {} +
          ls dist

      - name: Desplegar Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNC }}
          package: dist
          sku: flexconsumption
          remote-build: true

      # En Flex, `az functionapp show --query defaultHostName` viene vacío: se lee del recurso ARM.
      - name: Host de la Function
        id: host
        run: |
          h=$(az resource show -g "$RG" -n "$FUNC" --resource-type Microsoft.Web/sites --query properties.defaultHostName -o tsv)
          [ -n "$h" ] || { echo "::error::sin defaultHostName para $FUNC"; exit 1; }
          echo "host=$h" | tee -a "$GITHUB_OUTPUT"

      # Primer arranque en frío: reintenta hasta ~3 min. 503 = llm o cosmos down (api.yaml v1.2).
      - name: Smoke /healthz
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o health.json -w '%{http_code}' "https://${{ steps.host.outputs.host }}/api/healthz" || true)
            echo "intento $i: $code $(cat health.json 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::/healthz no respondió 200"
          exit 1
