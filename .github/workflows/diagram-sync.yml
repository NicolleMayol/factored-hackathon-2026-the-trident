# Pieza reutilizable del pipeline (ADR-27): el orden y las condiciones viven en main.yml y pr.yml.
# Diagrama de arquitectura. Lo llama pr.yml cuando cambian diagrams/ o el impact-map.
# Valida y exporta los PNG como artifact del run, para revisar el dibujo antes del merge. No sube nada:
# al mergear, main.yml (diagram-export.yml) exporta y sube los PNG a main con la GitHub App del equipo.
name: diagram-sync
on:
  # Lo llama main.yml/pr.yml (ADR-27); workflow_dispatch queda para correrlo a mano.
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - name: Verificar que el .drawio no está comprimido
        run: |
          if grep -q "<diagram[^>]*>[A-Za-z0-9+/=]\{40,\}</diagram>" diagrams/arquitectura.drawio; then
            echo "El .drawio está comprimido: desmarca 'Comprimido' en draw.io y vuelve a guardar"; exit 1; fi
      - name: Coherencia diagrama ↔ impact-map
        run: python scripts/drawio_tool.py sync diagrams/arquitectura.drawio
      - name: Exportar PNG
        uses: rlespinasse/drawio-export-action@v2
        with:
          path: diagrams
          format: png
          output: out
          transparent: false
          scale: 2
          action-mode: all
      - name: Subir PNG como artifact
        uses: actions/upload-artifact@v4
        with:
          name: diagramas-png
          path: diagrams/out/*.png
          retention-days: 7
      - name: Aviso
        run: |
          echo "Vista previa en el artifact «diagramas-png». Al mergear, main sube los PNG solo." | tee -a "$GITHUB_STEP_SUMMARY"
