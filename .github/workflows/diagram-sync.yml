# Pieza reutilizable del pipeline (ADR-27): el orden y las condiciones viven en main.yml y pr.yml.
# Diagrama de arquitectura.
# PR: solo valida (sin commits del bot en la rama: un commit nuevo vuelve a disparar todos los workflows del PR).
# La exportación de PNG en main vive en diagram-export.yml: GitHub valida los permisos de todos los jobs
# de una pieza reutilizable, y desde un PR no se puede pedir contents: write.
name: diagram-sync
on:
  # Lo llama main.yml/pr.yml (ADR-27); workflow_dispatch queda para correrlo a mano.
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - name: Verificar que el .drawio no está comprimido
        run: |
          if grep -q "<diagram[^>]*>[A-Za-z0-9+/=]\{40,\}</diagram>" diagrams/arquitectura.drawio; then
            echo "El .drawio está comprimido: desmarca 'Comprimido' en draw.io y vuelve a guardar"; exit 1; fi
      - name: Coherencia diagrama ↔ impact-map
        run: python scripts/drawio_tool.py sync diagrams/arquitectura.drawio
