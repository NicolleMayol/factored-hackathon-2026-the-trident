# Diagrama de arquitectura.
# PR: solo valida (sin commits del bot en la rama: un commit nuevo vuelve a disparar todos los workflows del PR).
# main: exporta los PNG una vez, al mergear, y los sube con [skip ci] para no disparar nada.
name: diagram-sync
on:
  pull_request:
    paths: ["diagrams/**", "contracts/impact-map.yaml"]
  push:
    branches: [main]
    paths: ["diagrams/**", "!diagrams/out/**"]

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - name: Verificar que el .drawio no está comprimido
        run: |
          if grep -q "<diagram[^>]*>[A-Za-z0-9+/=]\{40,\}</diagram>" diagrams/arquitectura.drawio; then
            echo "El .drawio está comprimido: desmarca 'Comprimido' en draw.io y vuelve a guardar"; exit 1; fi
      - name: Coherencia diagrama ↔ impact-map
        run: python scripts/drawio_tool.py sync diagrams/arquitectura.drawio

  export:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    concurrency: { group: diagram-export, cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4
      - name: Exportar PNG
        uses: rlespinasse/drawio-export-action@v2
        with:
          path: diagrams
          format: png
          output: out
          transparent: false
          scale: 2
          action-mode: all
      - name: Subir exportes a main
        run: |
          git config user.name "diagram-bot"; git config user.email "bot@users.noreply.github.com"
          git add diagrams/out
          if git diff --cached --quiet; then echo "sin cambios"; else git commit -m "chore(diagrams): export [skip ci]" && git push; fi
