# ADR-26 · Release por tag. Un tag vX.Y.Z sobre un commit de main crea el GitHub Release con las
# notas de los PRs mergeados desde el tag anterior. No despliega: deploy y deploy-web salen de main.
# v0.x se publica como pre-release; v1.0.0 es la entrega a Factored.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: { contents: write, actions: read }
concurrency: { group: release, cancel-in-progress: false }

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # Solo se versiona lo que ya está en main (lo que se despliega).
      - name: El tag apunta a main
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME no apunta a un commit de main"; exit 1; }

      # ADR-27: solo se versiona un commit que pasó el pipeline de main completo.
      - name: El pipeline de main está en verde para este commit
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          c=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/main.yml/runs?head_sha=$GITHUB_SHA&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "sin run"')
          [ "$c" = success ] || { echo "::error::main.yml para $GITHUB_SHA: $c"; exit 1; }

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""; [[ "$TAG" == v0.* ]] && pre="--prerelease"
          msg=$(git tag -l --format='%(contents:subject)' "$TAG")
          gh release create "$TAG" --verify-tag --generate-notes $pre --title "$TAG${msg:+ · $msg}"
          echo "Release: $(gh release view "$TAG" --json url -q .url)" | tee -a "$GITHUB_STEP_SUMMARY"
