# Contrato de tablas gold/ref · owner: datos (Eladio) · consumers: ia-ml · v6 · 2026-10-02
# v6 (E5/E6): + credit_product_catalog.product_type_dataset (join con customer_products) y .min_score (lo usa el motor);
#     ref.regulator_rates cambia de grano a país × producto × rate_kind × snapshot y añade rate_kind. Avisar: ia-ml.
# v5 (PR #27, opción 2 acordada con ia-ml): + gold.customer_360.country_code (MX|CO|AR). Quita la traducción entre
#     la convención de customer_360/contact_demand (nombre completo) y la de catalog/regulator_rates/policy_chunks (ISO-2).
#     get_customer_profile lo devuelve; tools.yaml mapea por nombre solo si falta. Avisar: ia-ml.
# v4 (ADR-23, verificado contra landing): source.landing.format parquet -> csv; + format_opts (header, multiLine, schema_hints) y layout; nulos reales de customer_360 (credit_score 14,99 %, estimated_monthly_income 20,02 %). Avisar: ia-ml.
# v3 (ADR-22): bronze y silver dejan de ser decisión abierta: 13 tablas 1:1 en bronze, 7 en silver, columnas del diccionario de Factored v1.0.0; clientes TEST-* solo en gold; hallazgos del diccionario (sin portugués, rate_kind). Avisar: ia-ml.
# v2 (ADR-20): + bloque source (la ingesta lee la copia en ADLS, no S3); esquemas de bronze y silver como decisión abierta (E9). Avisar: ia-ml.
catalog: hackathon
schemas: [bronze, silver, gold, ref, ops, ml]   # un container homónimo en adlsagentbankdev y una external location ext-loc-adlsagentbankdev-<esquema> (ADR-20)
source:
  landing: {path: "abfss://landing@adlsagentbankdev.dfs.core.windows.net/factored-datathon/data/", format: csv, format_opts: {header: true, multiLine: true, schema_hints: "explícitos por tabla"}, layout: "6 CSV en la raíz (5 dimensiones + daily_exchange_rates) y 7 carpetas particionadas <tabla>/year=/month=/day= (hechos)", copy: "workflow data-landing (azcopy, cada 6 h al minuto 17)", carga_inicial: "2026-09-30: 7.671 archivos, 5.349.322.481 bytes", external_location: ext-loc-adlsagentbankdev-landing}
  ingest: {tool: "Auto Loader en SDP", discovery: "directory listing (file events queda en To-Be: exige una cola y una suscripción de Event Grid fuera de Terraform)", checkpoint: "lo gestiona el pipeline; no se configura a mano", schema_evolution: "addNewColumns + _rescued_data", schedule: "cada 6 h al minuto 50", partition: none}
  bronze_silver: {adr: ADR-22, doc: docs/adr/22-esquemas-bronze-silver.md, diccionario: "LATAM Bank Complete Data Dictionary v1.0.0 (Factored, sep 2026)", bronze: "13 tablas 1:1 + _ingested_at, _source_file, _rescued_data", silver: "7 tablas: customers, products, transactions, call_center_interactions, call_transcripts, satisfaction_surveys, daily_exchange_rates", solo_bronze: "branches, service_agents, marketing_campaigns, digital_events, complaints, campaign_sends (12,08 M de filas; no alimentan gold)", verificacion: "test: esquema de read_files() vs ADR-22, antes de cerrar E1"}
  test_users: "los 5 clientes TEST-* de docs/test-users.md (M3) se inyectan solo en gold.customer_360, nunca en bronze ni silver, y quedan fuera de toda agregación y métrica (ADR-22)"
  hallazgos: {sin_portugues: "el dataset es solo español (MX/CO/AR): gold.intent_labels no tiene PT real y el clasificador de ADR-07 no se puede medir en PT con dato de Factored; decisión de ia-ml", rate_kind: "data/mock/regulator_rates.csv tiene rate_kind y este contrato no; se resuelve en E6 con test de cabeceras"}
  volumes: {policy_docs: hackathon.ref.policy_docs, fuentes: hackathon.ref.fuentes, tipo: managed}
  medido_2026_10_02: {adr: ADR-23, archivos: 7671, gb: 5.1, formato: "csv en el 100 %", multiline: "obligatorio: sin él call_transcripts da 548.336 filas en vez de 171.321", idioma: "call_transcripts.detected_language = es en el 100 %", nulos_customer_360: {credit_score: "14,99 %", estimated_monthly_income: "20,02 %"}, country_origen: "México con tilde; silver normaliza a Mexico", duplicados_customers: "ninguno: 150.000 filas y 150.000 document_number distintos"}
  ops_write: "datos solo escribe ops.dq_results; agent_turns y ml_inference son de ia-ml, infra_requests de servicio"
tables:
  gold.customer_360:
    grain: 1 fila por customer_id
    key: [customer_id]
    columns:
      customer_id: {type: string, nullable: false}
      country: {type: string, nullable: false, values: [Mexico, Colombia, Argentina]}
      country_code: {type: string, nullable: false, values: [MX, CO, AR]}   # llave de join con credit_product_catalog, ref.regulator_rates y policy_chunks
      segment: {type: string, nullable: false}
      credit_score: {type: int, nullable: true, range: [300, 850]}
      estimated_monthly_income: {type: decimal(12,2), nullable: true}
      customer_status: {type: string, nullable: false}
      registration_date: {type: timestamp, nullable: false}
      detected_accent: {type: string, nullable: true}
      _ingested_at: {type: timestamp, nullable: false}
    excluded_from_features: [gender, marital_status, date_of_birth]   # no discriminación
    dedup: document_number, último last_updated
  gold.customer_products:
    grain: 1 fila por product_id
    key: [product_id]
    columns: {product_id: string, customer_id: string, product_type: string, currency: string, current_balance: "decimal(15,2)", credit_limit: "decimal(15,2)", days_past_due: int, product_status: string, _ingested_at: timestamp}
  gold.customer_behavior_12m:
    grain: 1 fila por customer_id
    cutoff_date: 2025-06-30
    columns: {customer_id: string, n_tx: int, amount_usd_12m: "decimal(15,2)", declined_ratio: "decimal(5,4)", max_days_past_due: int, active_months: int, _ingested_at: timestamp}
  gold.credit_product_catalog:
    grain: 1 fila por producto × país
    synthetic: true
    source: "policy/catalog.yaml, generado por data/ref/build_catalog.py (E5): AR del BCRA, CO y MX de percentiles del dataset"
    columns: {product_code: string, country: string, name_es: string, name_pt: string, product_type: string, product_type_dataset: "string, nullable (vacío = oferta sin cartera en el dataset); join con gold.customer_products.product_type", min_score: int, currency: string, rate_min: "decimal(5,2)", rate_max: "decimal(5,2)", amount_min: "decimal(15,2)", amount_max: "decimal(15,2)", term_months_max: int, requirements: string, valid_from: date, valid_to: date, es_sintetico: boolean}
  gold.intent_labels:
    grain: 1 fila por transcript_id
    split: {by: process_date, test: últimos 3 meses}
    columns: {transcript_id: string, customer_text: string, detected_intents: string, contact_reason: string, reason_category: string, detected_language: string, process_date: date, intent_label: string, action_label: string}
  gold.contact_demand:
    grain: día × país × reason_category
    columns: {date: date, country: string, reason_category: string, volume: int, fcr_rate: "decimal(5,4)", escalated: int, wait_p50_s: int, csat_avg: "decimal(3,2)"}
  ref.regulator_rates:
    grain: país × producto × rate_kind × snapshot
    source: "data/ref/regulator_rates_<fecha>.csv, generado por data/ref/ingest_regulator_rates.py (E6); AR del BCRA por API, CO y MX a mano"
    columns: {country: string, product_type: string, rate_kind: "string, values: [ea, tna, cat, cft, usura]; usura/cat/cft son el techo del país (decisión de ia-ml, PR #23)", rate_min: "decimal(5,2)", rate_max: "decimal(5,2)", source: string, url: string, snapshot_date: date}
