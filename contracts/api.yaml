openapi: 3.0.3
info: {title: Agente Crédito LATAM API, version: "1.3.0", description: "owner endpoints: /session y /meta servicio; resto ia-ml. v1.3 (ADR-25, 2026-10-05): GET /meta público para que la UI lea personas, países, productos, resultados y motivos de los mismos archivos que el agente. consumers: servicio (frontend, carga). v1.2 (revisión PR #16): /healthz devuelve 200 con ok|cold|down por dependencia y 503 solo si llm o cosmos están down; sin mensajes ni nombres internos. v1.1 (ADR-21, 2026-10-01): scope handoff:read en /handoff y /trace; /chat/confirm y /healthz detallados; JWT HS256 validado en código, auth_level anonymous."}
paths:
  /session: {post: {summary: Emite JWT de prueba (customer_id, scopes, exp 30 min)}}
  /meta: {get: {summary: "Datos para la UI (ADR-25). Público, sin JWT ni customer_id; cache 5 min", public: true, responses: {"200": {catalog_version, users: "[{key, locale, scopes, country}] de los usuarios de /session; country de las filas TEST-* (ADR-22)", countries: "{ISO-2: nombre} de policy/catalog.yaml", products: "{product_code: {country, type, currency, name: {es, pt}, rate_min, rate_max, amount_min, amount_max, term_months_max}} de policy/catalog.yaml", tools: "claves de contracts/tools.yaml", outcomes: "enum de evaluate_eligibility.outcome (tools.yaml)", reason_codes: "enum de handoff.schema.json"}}}}
  /chat: {post: {summary: Turno de conversación, requestBody: {conversation_id, message, locale}, responses: {"200": {reply, action: "answer|clarify|confirm|escalate|blocked", citations: [{type: "chunk|rule|tool", id}], trace_id, cost_usd, latency_ms}, "401": {}, "429": {}}}}
  /chat/confirm: {post: {summary: Confirma una acción pendiente (action_id) dejada por evaluate_eligibility, requestBody: {conversation_id, action_id, confirmed: boolean}, responses: {"200": {reply, action: "answer|escalate", citations, trace_id}, "404": {action_id desconocido o vencido (TTL 10 min)}, "401": {}}}}
  /trace/{trace_id}: {get: {summary: Nodos ejecutados, tools, reglas disparadas, versiones, security: [{bearer: [handoff:read]}], responses: {"403": {sin scope handoff:read}}}}
  /handoff/{case_id}: {get: {summary: Paquete de handoff (contracts/handoff.schema.json), security: [{bearer: [handoff:read]}], responses: {"403": {sin scope handoff:read}}}}
  /healthz: {get: {summary: Estado de dependencias, public: true (sin JWT), responses: {"200": {llm: "ok|cold|down", cosmos: "ok|cold|down", prescore: "ok|cold|down", embed: "ok|cold|down", sql: "ok|cold|down"}, "503": {misma forma; solo cuando llm o cosmos están down}}, nota: "sin mensajes de error ni nombres internos; cold = scale-to-zero o auto-stop, no es fallo; N8 revisa llm y cosmos; el agente lee este estado para tolerar el frío (tools.yaml v2)"}}
components:
  securitySchemes: {bearer: {type: http, scheme: bearer, bearerFormat: JWT HS256 (JWT_SIGNING_KEY), claims: [customer_id, scopes, exp]}}
  scopes: {customer:read: lee perfil y productos del customer_id del token, credit:simulate: pre-score y evaluate_eligibility, handoff:read: agente humano; /handoff y /trace, public: sin token}
