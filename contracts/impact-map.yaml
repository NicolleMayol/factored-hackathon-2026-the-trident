# Mapa de impacto: qué elemento del sistema es propiedad de quién y quién lo consume.
# El skill adr-hackathon y el workflow adr-impact leen este archivo.
# roles: datos (Eladio) · ia-ml (Manuela) · servicio (Nicolle)
version: 1
roles:
  datos: { name: Eladio, github: "@eladioyovera" }
  ia-ml: { name: Manuela, github: "@manularrea" }
  servicio: { name: Nicolle, github: "@nicollemayol" }

elements:
  # --- contratos de datos ---
  - id: gold.customer_360
    file: contracts/gold.yaml
    owner: datos
    consumers: [ia-ml]
    used_by: [get_customer_profile, prescore_features]
  - id: gold.customer_products
    file: contracts/gold.yaml
    owner: datos
    consumers: [ia-ml]
    used_by: [get_customer_products, policy_flags]
  - id: gold.customer_behavior_12m
    file: contracts/gold.yaml
    owner: datos
    consumers: [ia-ml]
    used_by: [prescore_features]
  - id: gold.credit_product_catalog
    file: contracts/gold.yaml
    owner: datos
    consumers: [ia-ml]
    used_by: [policy/catalog.yaml, search_policy, evaluate_eligibility]
  - id: gold.policy_chunks
    file: contracts/chunks.yaml
    owner: ia-ml
    consumers: [datos, servicio]
    used_by: [E7 pipeline, cosmos.policy_chunks vector index]
  - id: gold.intent_labels
    file: contracts/gold.yaml
    owner: datos
    consumers: [ia-ml]
    used_by: [intent_classifier]
  - id: gold.contact_demand
    file: contracts/gold.yaml
    owner: datos
    consumers: [ia-ml]
    used_by: [pitch slide 2]
  - id: ref.regulator_rates
    file: contracts/gold.yaml
    owner: datos
    consumers: [ia-ml]
    used_by: [groundedness rate check, catalog calibration]
  # --- tools y política (ia-ml) ---
  - id: tools.*
    file: contracts/tools.yaml
    owner: ia-ml
    consumers: [datos, servicio]
    used_by: [gold schemas, Function App settings]
  - id: policy.policy.yaml
    file: policy/policy.yaml
    owner: ia-ml
    consumers: [servicio]
    used_by: [test users N4, handoff view N5]
  - id: policy.glossary.yaml
    file: policy/glossary.yaml
    owner: ia-ml
    consumers: []
  # --- API y servicio (servicio) ---
  - id: api.POST_/chat
    file: contracts/api.yaml
    owner: ia-ml
    consumers: [servicio]
    used_by: [chat en Static Web Apps, load test N7]
  - id: api.POST_/session
    file: contracts/api.yaml
    owner: servicio
    consumers: [ia-ml]
    used_by: [auth node]
  - id: api.GET_/trace
    file: contracts/api.yaml
    owner: ia-ml
    consumers: [servicio]
  - id: api.GET_/handoff
    file: contracts/api.yaml
    owner: ia-ml
    consumers: [servicio]
    used_by: [handoff view N5]
  - id: handoff.schema
    file: contracts/handoff.schema.json
    owner: ia-ml
    consumers: [servicio]
  - id: infra.function_app_settings
    file: contracts/infra.yaml
    owner: servicio
    consumers: [ia-ml]
    used_by: [DATABRICKS_HOST, DATABRICKS_CLIENT_ID, DATABRICKS_CLIENT_SECRET, SQL_HTTP_PATH, FM_ENDPOINT_MAIN, FM_ENDPOINT_SMALL, PRESCORE_ENDPOINT, COSMOS_ENDPOINT, COSMOS_KEY, MLFLOW_TRACKING_URI, MLFLOW_EXPERIMENT, JWT_SIGNING_KEY, APPLICATIONINSIGHTS_CONNECTION_STRING]
  - id: infra.cosmos
    file: contracts/infra.yaml
    owner: servicio
    consumers: [ia-ml, datos]
    used_by: [conversations, handoffs, policy_chunks vector index 1024 cosine, 3 × 400 RU/s dedicados, E7 JSONL load]
  - id: infra.databricks_access
    file: contracts/infra.yaml
    owner: servicio
    consumers: [datos, ia-ml]
    used_by: [sp-agent-ro, grants UC, catálogo hackathon, sp-pipelines, grants del equipo, storage credential, esquemas bronze/silver/gold/ref/ops/ml, wh-agent http path, CAN_EDIT experimento /Shared/fh26/agente]
  - id: infra.model_serving
    file: contracts/infra.yaml
    owner: servicio
    consumers: [ia-ml]
    used_by: [PRESCORE_ENDPOINT, endpoint prescore-lgbm, scale_to_zero]
  # --- observabilidad ---
  - id: ops.infra_requests
    file: contracts/ops.yaml
    owner: servicio
    consumers: [datos]
    used_by: [tablero AI/BI]
  - id: ops.dq_results
    file: contracts/ops.yaml
    owner: datos
    consumers: [servicio]
    used_by: [alerta DQ, "poblada por expectativas de SDP y por checks propios; esquema sin cambio (ADR-20)"]
  - id: ops.agent_turns
    file: contracts/ops.yaml
    owner: ia-ml
    consumers: [datos, servicio]
    used_by: [tablero AI/BI, N7 correlación carga]
  - id: ops.ml_inference
    file: contracts/ops.yaml
    owner: ia-ml
    consumers: [datos]
  # --- eval ---
  - id: eval.cases
    file: eval/cases.jsonl
    owner: ia-ml
    consumers: [servicio]
    used_by: [CI gate, load test N7]

# Reglas de gate: un cambio en un elemento con consumers ≠ owner exige
# revisión aprobada de cada consumer antes de mergear (CODEOWNERS + workflow adr-impact).

  # --- añadidos 2026-09-29 tras el diagrama de Eladio/Nicolle (DEMO) ---
  - {id: infra.app_service,       file: contracts/infra.yaml, owner: servicio, consumers: [ia-ml],          used_by: [swa-agent-bank-dev Static Web Apps Free (ADR-19 v3), chat UI, /handoff view, CORS a la Function App]}
  - {id: infra.identity,          file: contracts/infra.yaml, owner: servicio, consumers: [ia-ml],          used_by: [mock JWT HS256 (ADR-12 cerrada), POST /session, claims → customer_id]}
  - {id: infra.key_vault,         file: contracts/infra.yaml, owner: servicio, consumers: [ia-ml, datos],   used_by: [sp-agent-ro-client-secret, cosmos-key, jwt-signing-key, secret scope fh26]}
  - {id: infra.adls,              file: contracts/infra.yaml, owner: servicio, consumers: [datos, ia-ml],   used_by: [bronze/silver/gold en ADLS Gen2 vía Access Connector, contenedor landing (copia de S3, workflow data-landing), contenedor ops-export]}
  - {id: infra.fm_apis,           file: contracts/infra.yaml, owner: servicio, consumers: [ia-ml],          used_by: [FM_ENDPOINT_MAIN, FM_ENDPOINT_SMALL, AI Gateway rate limit; modelo en ADR-02 (ia-ml)]}
  - {id: infra.ci_cd,             file: contracts/infra.yaml, owner: servicio, consumers: [datos, ia-ml],   used_by: [workflow infra (plan/apply), environment hackathon, SP sp-deploy-iac-hackathon, Asset Bundles, gates adr-impact/diagram-sync/terraform-plan]}
  - {id: data.source_s3,          file: contracts/gold.yaml,  owner: datos,    consumers: [],               used_by: [bucket Factored read-only, "Databricks ya no lee S3: lee la copia en landing (ADR-20)"]}
  - {id: data.ingest_s3,          file: contracts/gold.yaml,  owner: datos,    consumers: [],               used_by: ["Auto Loader en SDP → bronze desde landing (Parquet, directory listing, cada 6 h al minuto 50) (ADR-20)"]}
  - {id: data.pipeline_medallon,  file: contracts/gold.yaml,  owner: datos,    consumers: [ia-ml],          used_by: ["SDP declarativo bronze→silver→gold (ADR-20)", Lakeflow Jobs, "DQ en dos vías: expectativas SDP + checks propios"]}
  - {id: ml.features,             file: contracts/gold.yaml,  owner: ia-ml,    consumers: [datos],          used_by: [customer_behavior_12m + customer_360 → feature table]}
  - {id: ml.prescore_lgbm,        file: contracts/ops.yaml,   owner: ia-ml,    consumers: [servicio],       used_by: [registro UC hackathon.ml.prescore_lgbm, Model Serving]}

  # --- añadidos 2026-09-29 por ADR-18 (agente en la Function App) ---
  - {id: infra.function_app,      file: contracts/infra.yaml, owner: servicio, consumers: [ia-ml],          used_by: [plan Flex Consumption, runtime python3.11, 2048 MB, máx. 10 instancias, arranque ≤ 30 s, host de agent.runtime]}
  - {id: agent.runtime,           file: contracts/infra.yaml, owner: ia-ml,    consumers: [servicio],       used_by: [grafo LangGraph en la Function App, POST /chat, POST /chat/confirm, GET /trace, GET /handoff, GET /healthz, M6]}
  - {id: agent.prompts,           file: agent/prompts/,       owner: ia-ml,    consumers: [],               used_by: [hash → ops.agent_turns.prompt_version]}

  # --- añadidos 2026-09-29 por ADR-19 (plan de infraestructura en Terraform) ---
  - {id: infra.iac,               file: contracts/infra.yaml, owner: servicio, consumers: [datos, ia-ml],   used_by: [infra/azure, infra/databricks, infra/scripts/ensure-backend.sh, estado en sttfstateagentbankdev]}
  - {id: infra.databricks_workspace, file: contracts/infra.yaml, owner: servicio, consumers: [datos, ia-ml], used_by: [dbw-agent-bank-dev Premium, solo serverless, DATABRICKS_HOST]}

  # --- añadidos 2026-09-30 por ADR-20 (plataforma de datos e ingesta) ---
  - {id: infra.uc_external_locations, file: contracts/infra.yaml, owner: servicio, consumers: [datos, ia-ml], used_by: ["stg-credential-adlsagentbankdev", "ext-loc-adlsagentbankdev-{bronze,silver,gold,ref,ops,ml-data,landing,unity-catalog}", "managed location por esquema", "READ FILES de sp-pipelines sobre la de landing"]}
  - {id: infra.uc_volumes,            file: contracts/infra.yaml, owner: servicio, consumers: [datos, ia-ml], used_by: ["hackathon.ref.policy_docs managed (E7)", "hackathon.ref.fuentes managed (E6)", "la escritura sale de los grants de ref"]}
  - {id: ml.embeddings_endpoint,      file: contracts/chunks.yaml, owner: ia-ml,   consumers: [datos, servicio], used_by: ["CERRADA (ADR-21): Model Serving embed-bge-m3, modelo hackathon.ml.bge_m3 int8 ONNX 1024 dims", "E7 y nodo Act usan el mismo endpoint", EMBED_ENDPOINT]}

  # --- añadidos 2026-10-01 por ADR-21 (ajustes de ia-ml tras ADR-19 y ADR-20) ---
  - {id: policy.test_users,          file: docs/test-users.md,    owner: ia-ml,    consumers: [servicio, datos], used_by: [POST /session (N4), 5 clientes + analista con handoff:read, eval/cases.jsonl, "filas TEST-* en gold.customer_360 (E1)"]}
  - {id: tools.limits,               file: contracts/tools.yaml,  owner: ia-ml,    consumers: [servicio],        used_by: ["timeout 8 s, retries 2, circuit breaker 5", "cold_start: timeout extendido una vez; keep-warm solo en demos (ADR-21 v1.1)"]}
  - {id: api.scopes,                 file: contracts/api.yaml,    owner: ia-ml,    consumers: [servicio],        used_by: ["customer:read, credit:simulate, handoff:read, public", "JWT HS256 validado en código (auth_level anonymous)"]}
  - {id: eval.external_data_guard,   file: eval/,                 owner: ia-ml,    consumers: [datos],           used_by: ["regla Factored: fuentes externas justificadas y fuera de entrenamiento y evaluación", "test en CI: 0 columnas ref.* en features; eval solo dataset + catálogo sintético"]}
  - {id: data.analytics_insights,    file: data/,                 owner: datos,    consumers: [ia-ml, servicio], used_by: ["notebook de insights (E10): demanda de crédito por país e idioma, segmentos, por qué workflow 4", "dimensión Data Analytics del reto", slides]}
