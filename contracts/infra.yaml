# Contrato de infraestructura · owner: servicio (Nicolle); agent_runtime solo en código (ia-ml) · v6.1 · 2026-10-01
# v2 (ADR-18): plan Consumption → Flex Consumption; FM_ENDPOINT → FM_ENDPOINT_MAIN + FM_ENDPOINT_SMALL; + MLFLOW_TRACKING_URI; sp-agent-ro CAN_EDIT sobre el experimento MLflow; agent_runtime. Avisar: servicio, datos.
# v3 (ADR-19): toda la infra en Terraform, owner servicio (databricks_access, adls, model_serving, fm_apis pasan a servicio); región eastus2; + APPLICATIONINSIGHTS_CONNECTION_STRING; secretos como referencias a Key Vault; Cosmos 3 × 400 RU/s dedicados (vector search no admite throughput compartido); app_service F1 → Web App B1 (UI + BFF, diagrama DEMO); ADR-12 cerrada (mock JWT HS256). Avisar: datos, ia-ml.
# v4 (ADR-19 v3): app_service → Static Web Apps Free (cuota B1 = 0); Function con CORS y triggers anónimos + JWT en código; Terraform solo en GitHub Actions, sin infra/bootstrap; CI con el SP sp-deploy-iac-hackathon (secreto temporal → OIDC); scope fh26 administrado por Databricks; workspace sku trial; llaves de S3 fuera de Key Vault y Databricks (solo GitHub, workflow data-landing); ADLS + contenedor landing. Avisar: datos, ia-ml.
# v6 (ADR-19 v3.2, despliegue de infra/databricks): container ml-data para el esquema ml (Azure pide 3 a 63 caracteres); 8 external locations (+ unity-catalog, managed location del catálogo); metastore_azure_eastus2 asignado por Terraform; ia-ml con USE SCHEMA, SELECT, CREATE TABLE en ops; CAN_USE wh-agent para ia-ml. Avisar: datos, ia-ml.
# v5 (ADR-20, pedido de datos; ajustado en la revisión del PR #8): un container por esquema en adlsagentbankdev con el mismo nombre; storage_credential stg-credential-adlsagentbankdev; 7 external locations ext-loc-adlsagentbankdev-{bronze,silver,gold,ref,ops,ml,landing}; grants por esquema (ALL PRIVILEGES en bronze/silver/gold/ref/ops, sin ml) para datos y sp-pipelines; READ FILES de sp-pipelines en la external location de landing; volúmenes managed hackathon.ref.policy_docs y hackathon.ref.fuentes; CAN_USE wh-agent para datos y sp-pipelines; lectura del scope fh26 para sp-pipelines; bundles.yml con run_as = sp-pipelines. El Access Connector se queda con Storage Blob Data Contributor: la ingesta va con directory listing. Nicolle tiene account admin desde 2026-09-29: infra/databricks ya no está bloqueado. Avisar: servicio, ia-ml.
# v6.1 (PR #18, ADR-21 v1.2): policy_chunks con full-text policy e índice en /text_es (es-ES) y /text_pt (pt-BR) para búsqueda híbrida; EnableNoSQLFullTextSearch y EnableNoSQLFullTextSearchPreviewFeatures (es-ES, pt-BR) con azapi_update_resource; azurerm ignora las capabilities (reemplazaría la cuenta); bundles.yml copia data/policy_docs/docs/ a hackathon.ref.policy_docs y data/mock/catalog.yaml a hackathon.ref.fuentes. Avisar: ia-ml, datos.
