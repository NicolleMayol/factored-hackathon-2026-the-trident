# Contrato de tools del agente · owner: ia-ml (Manuela) · consumers: datos, servicio · v1 · 2026-09-28
# customer_id SIEMPRE sale del JWT, nunca del texto del usuario.
tools:
  get_customer_profile:   {scope: customer:read,   reads: gold.customer_360,          writes: none, side_effect: false}
  get_customer_products:  {scope: customer:read,   reads: gold.customer_products,     writes: none, side_effect: false}
  search_policy:          {scope: public,          reads: cosmos.policy_chunks,       params: [query, country, language, top_k=5], returns: [chunk_id, text, rule_id, version, score]}
  get_prescore:           {scope: credit:simulate, reads: PRESCORE_ENDPOINT,          returns: [probability, ci_low, ci_high, shap_top3, model_version]}
  evaluate_eligibility:   {scope: credit:simulate, requires_user_confirmation: true, reads: [policy/policy.yaml, policy/catalog.yaml], returns: [outcome: "Elegible|No elegible|Revisión humana", rules_fired, explanation_es, explanation_pt]}
  create_handoff:         {scope: always,          writes: cosmos.handoffs, idempotency_key: conversation_id, schema: contracts/handoff.schema.json}
limits: {max_tool_iterations_per_turn: 2, tool_timeout_s: 8, retries: 2, circuit_breaker_failures: 5, fallback: escalate}
