# Contrato de policy_chunks · owner: ia-ml · consumers: datos (E7), servicio (Cosmos N3) · v2.1 · 2026-10-02 (revisión PR #18: + text_es / text_pt para el índice full-text de Cosmos, uno por idioma del documento, el otro null; text sigue siendo el campo de cita) · v2 · 2026-10-01 (ADR-21: embedding servido por Model Serving embed-bge-m3; chunk y consulta usan el mismo endpoint)
embedding: {model: bge-m3, registry: hackathon.ml.bge_m3, endpoint: embed-bge-m3 (Model Serving, EMBED_ENDPOINT), dims: 1024, metric: cosine, quantization: int8-onnx (go/no-go medido en PT), model_version: se guarda en cada chunk}
chunk: {chunk_id: string, doc_id: string, text: string, text_es: "string|null", text_pt: "string|null", language: "es|pt", country: "MX|CO|AR|BR", product_code: string, rule_id: string, version: string, valid_from: date, valid_to: date, es_sintetico: true, embedding: "float[1024]", embedding_model_version: string, source: string, url: string, snapshot_date: date}
cosmos: {database: agent, container: policy_chunks, partition_key: /country, vector_index: {path: /embedding, type: diskANN, distance: cosine, dims: 1024}, full_text: {paths: [{path: /text_es, language: es-ES}, {path: /text_pt, language: pt-BR}], indexes: [/text_es, /text_pt], nota: "pt-BR: glosario, documentos y usuarios de prueba usan portugués de Brasil"}, query: "hybrid: RRF(VectorDistance(embedding), FullTextScore(text_<lang>)) + filtro country/language/product_code"}
source_of_truth: "data/policy_docs/ (repo) → paso en bundles.yml tras el deploy: databricks fs cp -r data/policy_docs/docs/ dbfs:/Volumes/hackathon/ref/policy_docs/ --overwrite (y data/mock/catalog.yaml → /Volumes/hackathon/ref/fuentes/) → E7 lee del volumen y parte en chunks importando data/policy_docs/build_corpus.py (mismos chunk_id)"
load: E7 embebe con embed-bge-m3 y produce JSONL con estos campos; el job de datos (sp-pipelines, cosmos-key del scope fh26) lo carga a Cosmos con throttle (400 RU/s).
