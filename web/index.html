<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente de crédito · Bank Company</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{color-scheme:light;--bg:#FFF6F2;--card:#FFFFFF;--ink:#22161A;--mute:#6B5A5F;--line:#F1D9D2;--brand:#B0243A;--brand-dk:#861B2C;
--ok:#145C3B;--ok-bg:#DDF3E7;--info:#1D3F8A;--info-bg:#E4ECFB;--warn:#7A4B00;--warn-bg:#FFF1DB;--stop:#7A1D1D;--stop-bg:#FBEAEA;
--display:'Bricolage Grotesque',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand)}a:hover{color:var(--brand-dk)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{width:100%;max-width:1280px;margin:0 auto;padding-left:32px;padding-right:32px}
@media (max-width:640px){.wrap{padding-left:16px;padding-right:16px}}

/* Cabecera */
header{background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:14px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:16px}.brand img{height:44px;width:auto;display:block}
.brand .sep{width:1px;height:26px;background:var(--line)}.brand b{font-weight:700}
#health{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
#health i{width:8px;height:8px;border-radius:50%;background:#C9B8B2}
#health.up i{background:#1F7A55}#health.slow i{background:#D08A00}#health.down i{background:var(--brand)}
@media (max-width:640px){.brand img{height:36px}.brand .sep,.brand b{display:none}}

/* Personas */
/* Cliente activo */
#current{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-top:20px}
#current[hidden]{display:none}
#current>span{font-size:13px;color:var(--mute)}#current b{font-weight:700}
.pill.sm{padding:6px 14px;min-height:36px;font-size:13px}
/* Elegir cliente */
#picker[hidden]{display:none}
#picker{flex:1 1 100%;padding:28px;display:flex;flex-direction:column;gap:18px}
#picker h1{margin:0;font:600 28px/1.15 var(--display)}#picker>p{margin:0;color:var(--mute);max-width:680px}
#picker h3{margin:6px 0 0;font-size:13px;font-weight:600;color:var(--mute)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-height:44px}
.pcard:hover,.pcard:focus-visible{border-color:var(--ink);outline:none}
.pcard b{font-size:16px}.pcard .d{font-size:14px;color:var(--mute)}.pcard .l{font-size:12px;color:var(--mute)}
@media (max-width:640px){#picker{padding:20px}}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;min-height:44px}

/* Área principal */
.stage{flex:1;display:flex;flex-wrap:wrap;gap:24px;padding-top:20px;padding-bottom:32px;align-items:flex-start}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
#chat,#analyst{flex:999 1 540px;min-width:0;display:flex;flex-direction:column}
#log{padding:24px;display:flex;flex-direction:column;gap:16px;overflow:auto;min-height:420px;max-height:calc(100vh - 290px)}
@media (max-width:640px){#log{padding:16px;max-height:70vh;min-height:360px}}
.hello{max-width:82%;display:flex;flex-direction:column;gap:4px}
.hello h1{margin:0;font:600 26px/1.15 var(--display)}.hello p{margin:0;color:var(--mute)}
.msg{max-width:80%;white-space:pre-wrap;overflow-wrap:anywhere}
.me{align-self:flex-end;max-width:72%;background:var(--ink);color:#fff;padding:12px 18px;border-radius:20px 20px 6px 20px}
.bot{align-self:flex-start;background:var(--bg);padding:14px 18px;border-radius:20px 20px 20px 6px;display:flex;flex-direction:column;gap:10px;white-space:normal}
.bot .txt{white-space:pre-wrap}
.bot.stop{background:var(--stop-bg);color:var(--stop)}
.bot.sel{box-shadow:0 0 0 2px var(--line)}
.typing{color:var(--mute);font-size:14px}
.tag{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-info{background:var(--info-bg);color:var(--info)}
.t-warn{background:var(--warn-bg);color:var(--warn)}.t-stop{background:#fff;color:var(--stop)}
sup.ref{color:var(--brand);font-weight:700;font-size:11px;margin-left:1px}
.case{font-size:13px}.case b{font-family:var(--mono);font-weight:400}
.why{align-self:flex-start;background:none;border:0;padding:0;font-size:13px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.why:hover{color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border-radius:999px;padding:11px 22px;min-height:44px}
.btn.pri{background:var(--brand);color:#fff;border:0;font-weight:700}.btn.pri:hover{background:var(--brand-dk)}
.btn.sec{background:var(--card);border:1px solid var(--line)}
/* Tarjeta de resultado */
.result{align-self:flex-start;max-width:80%;background:var(--card);border:2px solid var(--ok-bg);padding:16px 18px;border-radius:20px;display:flex;flex-direction:column;gap:12px}
.result.no{border-color:var(--stop-bg)}.result.rev{border-color:var(--info-bg)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.metrics div{display:flex;flex-direction:column;gap:2px}.metrics span{font-size:12px;color:var(--mute)}
.metrics strong{font:600 24px/1.2 var(--display);white-space:nowrap}
.result .out{color:var(--ok)}.result.no .out{color:var(--stop)}.result.rev .out{color:var(--info)}
.result .fine{font-size:13px;color:var(--mute)}
@media (max-width:640px){.msg,.result{max-width:92%}.metrics strong{font-size:20px}}
/* Sugerencias y entrada */
#sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
@media (max-width:640px){#sugg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}#sugg>*{flex:none}}
.sg{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;min-height:36px}
.sg:hover{border-color:var(--ink)}
form.bar{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--line)}
form.bar input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:13px 18px;font:inherit;background:var(--bg);color:var(--ink)}
form.bar input:focus{outline:2px solid var(--ink);outline-offset:1px}

/* Panel lateral */
aside{flex:1 1 320px;max-width:400px;display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){aside{max-width:none}}
aside h2{margin:0;font:600 20px/1.2 var(--display)}
#steps{padding:18px;display:flex;flex-direction:column;gap:16px}
.step{display:flex;gap:12px}
.step>i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font:700 12px/26px 'Plus Jakarta Sans',sans-serif;text-align:center;font-style:normal}
.step.last>i{background:var(--brand)}
.step div{display:flex;flex-direction:column;gap:4px}.step strong{font-weight:700}
.step span{font-size:13px;color:var(--mute)}.step span.good{color:#1F6B4A}.step span.bad{color:var(--stop)}
.step ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.step ol b{color:var(--brand);margin-right:6px}
.empty{font-size:14px;color:var(--mute)}
.never{background:var(--ink);color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px}
.never span{font-size:13px;color:#F3E3E6}
details.tech{font-size:12px;color:var(--mute);padding:0 4px}
details.tech summary{cursor:pointer}
details.tech div{font-family:var(--mono);margin-top:6px;overflow-wrap:anywhere;line-height:1.5}

/* Vista del analista */
#analyst{display:none;padding:24px;gap:16px}
#analyst h1{margin:0;font:600 26px/1.15 var(--display)}#analyst p{margin:0;color:var(--mute)}
#cases{display:flex;gap:6px;flex-wrap:wrap}
#cases button{font-family:var(--mono);font-size:13px}
#hf{display:flex;gap:8px;flex-wrap:wrap}
#hf input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:999px;padding:12px 18px;font:inherit;font-family:var(--mono);background:var(--bg)}
.hand{background:var(--bg);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hand dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:14px}
.hand dt{color:var(--mute)}.hand dd{margin:0;overflow-wrap:anywhere}
.hand ul{margin:0;padding-left:18px}
.hand pre{margin:6px 0 0;font:12px/1.45 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><img src="logo-bank.png" alt="Bank Company"><span class="sep"></span><b data-t="text.title">Asistente de crédito</b></div>
    <div id="health" role="status"><i></i><span>…</span></div>
  </div>
</header>

<nav id="current" class="wrap" hidden><span data-t="text.try_as"></span><b id="curLabel"></b><button type="button" class="pill sm" id="change" data-t="text.change"></button></nav>

<div class="stage wrap">
  <section id="picker" class="card">
    <h1 data-t="picker.title">¿Con qué cliente quieres probar?</h1>
    <p data-t="picker.sub">Son clientes de prueba con datos sintéticos.</p>
    <p id="loading" class="empty" role="status">Conectando con el asistente…</p>
    <div class="pcards" id="pcards"></div>
    <h3 data-t="picker.staff" hidden></h3>
    <div class="pcards" id="acards"></div>
  </section>

  <main id="chat" class="card" style="display:none">
    <div id="log" aria-live="polite"></div>
    <div id="sugg"></div>
    <form class="bar" id="f">
      <label for="m" class="sr" data-t="text.placeholder">Mensaje</label>
      <input id="m" autocomplete="off" data-tp="text.placeholder">
      <button class="btn pri" type="submit" data-t="text.send">Enviar</button>
    </form>
  </main>

  <main id="analyst" class="card">
    <h1 data-t="analyst.title"></h1>
    <p data-t="analyst.sub"></p>
    <div id="cases"></div>
    <form id="hf">
      <label for="case" class="sr" data-t="analyst.fields.case"></label>
      <input id="case" placeholder="case-…">
      <button class="btn pri" type="submit" data-t="analyst.open"></button>
    </form>
    <div id="hand"></div>
  </main>

  <aside id="side" style="display:none">
    <h2 id="whyTitle" data-t="text.why_title"></h2>
    <div id="steps" class="card"></div>
    <div class="never"><strong data-t="text.never_title"></strong><span data-t="text.never_body"></span></div>
    <details class="tech" id="tech" hidden><summary data-t="text.tech"></summary><div id="techD"></div></details>
  </aside>
</div>

<script>
// Sin datos de negocio en este archivo (ADR-25):
//  - datos (personas, países, productos, resultados, motivos, tools) → GET /api/meta, que lee los mismos archivos que el agente;
//  - textos por idioma → ui.json.
const API=(window.API_BASE||"").replace(/\/$/,"")+"/api";
let UI=null,META={users:[],countries:{},products:{},tools:[],outcomes:[],reason_codes:[]};
let tok=null,conv=null,cur=null,pending=null,lang="es",consent=null,selEl=null;
const cases=[];
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
// t("text.send") → texto del idioma activo; si falta, el del idioma por defecto; si tampoco, la clave.
function t(path,l=lang){const get=x=>path.split(".").reduce((o,k)=>o==null?o:o[k],UI&&UI.lang[x]);const v=get(l);return v!=null?v:(get(UI?UI.default_lang:"es")??path)}
const langOf=locale=>{const l=String(locale||"").slice(0,2);return UI&&UI.lang[l]?l:(UI?UI.default_lang:"es")};
async function call(path,opt={}){
 try{const r=await fetch(API+path,{...opt,headers:{"content-type":"application/json",...(tok?{authorization:"Bearer "+tok}:{}),...(opt.headers||{})}});
  let j={};try{j=await r.json()}catch(e){}return [r,j]}
 catch(e){return [{ok:false,status:0},{error:"network"}]}}

// Ids del corpus: POL-<país>-<product_code>-<idioma>-v<n>-R<k> y catalog:<product_code> (template.md, ADR-03).
const CHUNK=/^POL-[A-Z]{2}-([A-Z]{2}-[A-Z]+-\d+)-([a-z]{2})-v\d+-(R\d+)$/,CAT=/^catalog:([A-Z]{2}-[A-Z]+-\d+)$/;
const prodName=code=>{const p=META.products[code];return p?(p.name[lang]||p.name[UI.default_lang]||code):code};
const ctryName=c=>META.countries[c]||c;
function srcLabel(id){
 let m=CHUNK.exec(id);
 if(m){const p=META.products[m[1]];return [prodName(m[1]),p?ctryName(p.country):null,t("sections."+m[3])].filter(Boolean).join(" · ")}
 m=CAT.exec(id);
 if(m){const p=META.products[m[1]];return [t("text.catalog"),prodName(m[1]),p?ctryName(p.country):null].filter(Boolean).join(" · ")}
 const k=id.replace(/^(tool|rule):/,"");
 if(META.tools.includes(k))return t("tools."+k);
 if(/^rule:/.test(id))return `${t("text.rule")} ${k}`;
 return k}
const isRuleSrc=id=>/^rule:/.test(id)||["tool:evaluate_eligibility","tool:get_prescore","evaluate_eligibility","get_prescore"].includes(id);

// Una respuesta: texto con superíndices, fuentes en orden de aparición y, si hay, la pre-evaluación.
// El resultado se lee del texto con la lista de contracts/tools.yaml (el nodo verify del agente exige esa frase);
// tasa y plazo salen del catálogo del producto citado, no del texto.
function parse(j){
 const src=[];const at=id=>{let i=src.indexOf(id);if(i<0){src.push(id);i=src.length-1}return i+1};
 const html=esc(j.reply||"").replace(/\s*\[([^\]]+)\]/g,(all,inner)=>{const ids=inner.split(/\s*[,;]\s*/);
  if(!ids.every(x=>/^(POL-|catalog:|rule:|tool:)/.test(x)))return all;return ids.map(x=>`<sup class="ref">${at(x)}</sup>`).join("")});
 for(const c of (j.citations||[]))at(c.type==="tool"?c.id:(c.type==="rule"&&!/^rule:/.test(c.id)?"rule:"+c.id:c.id));
 let res=null;
 const outs=[...META.outcomes].sort((a,b)=>b.length-a.length);
 const out=outs.find(o=>new RegExp(`:\\s*${o.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}\\b`).test(j.reply||""));
 if(out){const codes=[...new Set(src.map(id=>(CHUNK.exec(id)||CAT.exec(id)||[])[1]).filter(Boolean))];
  res={out,product:codes.length===1?META.products[codes[0]]:null}}
 return {html,src,res,usedRules:src.some(isRuleSrc)}}

function add(cls,html){const d=document.createElement("div");d.className="msg "+cls;d.innerHTML=html;$("log").appendChild(d);$("log").scrollTop=$("log").scrollHeight;return d}
const TAGCLS={answer:"t-ok",answer_plain:"t-ok",confirm:"t-info",clarify:"t-info",escalate:"t-warn",blocked:"t-stop",reject:"t-stop",error:"t-stop"};
const tag=k=>`<span class="tag ${TAGCLS[k]||"t-info"}">${esc(k==="error"?t("text.error"):t("tags."+k))}</span>`;
const num=x=>Number(x).toLocaleString(lang,{maximumFractionDigits:2});
// Color por posición en el enum de contracts/tools.yaml (favorable, desfavorable, revisión humana).
const OUTCLS=o=>{const i=META.outcomes.indexOf(o);return ["","no","rev"][i]??""};

function renderBot(j){
 const p=parse(j);let d;
 if(p.res&&j.action==="answer"){
  const pr=p.res.product;const m=[`<div><span>${esc(t("text.result"))}</span><strong class="out">${esc(t("outcomes."+p.res.out))}</strong></div>`];
  if(pr&&pr.rate_min!=null)m.push(`<div><span>${esc(t("text.rate"))}</span><strong>${num(pr.rate_min)}–${num(pr.rate_max)} %</strong></div>`);
  if(pr&&pr.term_months_max!=null)m.push(`<div><span>${esc(t("text.term"))}</span><strong>${pr.term_months_max} ${esc(t("text.months"))}</strong></div>`);
  d=add("result "+OUTCLS(p.res.out),`<div class="metrics">${m.join("")}</div><div class="txt">${p.html}</div>`);
 }else{
  const k=j.action==="answer"&&!p.src.length?"answer_plain":j.action;
  d=add("bot"+(["blocked","reject"].includes(j.action)?" stop":""),`${tag(k)}<div class="txt">${p.html}</div>`+
   (j.case_id?`<div class="case">${esc(t("text.case_for"))}: <b>${esc(j.case_id)}</b></div>`:""));
 }
 if(j.case_id&&!cases.includes(j.case_id))cases.unshift(j.case_id);
 const ctx={consent:j.action==="confirm"?null:consent};
 const w=document.createElement("button");w.type="button";w.className="why";w.textContent=t("text.see_why");
 w.onclick=()=>{why(j,ctx,d);if(innerWidth<900)$("whyTitle").scrollIntoView({behavior:"smooth"})};d.appendChild(w);
 why(j,ctx,d);return d}

// Panel "Por qué te respondí esto": solo datos de la respuesta (acción, citas, caso) y del consentimiento de esta conversación.
function why(j,ctx,el){
 if(selEl)selEl.classList.remove("sel");selEl=el||null;if(selEl)selEl.classList.add("sel");
 const p=parse(j);const st=[];const pair=k=>{const [h,b]=t("why."+k);return [h,`<span>${esc(b)}</span>`]};
 if(j.action==="confirm")st.push(pair("ask_consent"));
 else if(ctx.consent!=null&&p.usedRules)st.push([t("why.consent"),ctx.consent?`<span class="good">${esc(t("why.consent_yes"))}</span>`:`<span class="bad">${esc(t("why.consent_no"))}</span>`]);
 if(p.usedRules&&j.action!=="confirm")st.push(pair("rules"));
 if(p.src.length)st.push([t("why.sources"),`<ol>${p.src.map((id,i)=>`<li title="${esc(id)}"><b>${i+1}</b>${esc(srcLabel(id))}</li>`).join("")}</ol>`]);
 if(j.action==="escalate"){const s=pair("next_person_case");if(j.case_id)s[1]=s[1].replace("</span>",` <b style="font-family:var(--mono);font-weight:400">${esc(j.case_id)}</b></span>`);st.push(s)}
 else if(p.res)st.push(pair("next_person_result"));
 else if(["blocked","clarify","confirm"].includes(j.action))st.push(pair(j.action));
 steps(st);
 const tech=[j.latency_ms!=null?`${Math.round(j.latency_ms)} ms`:null,j.cost_usd!=null?`${Number(j.cost_usd).toFixed(4)} USD`:null,j.trace_id?`trace ${esc(String(j.trace_id).slice(0,8))}`:null,`action ${esc(j.action)}`].filter(Boolean).join(" · ");
 $("techD").innerHTML=tech+(p.src.length?"<br>"+p.src.map(esc).join("<br>"):"");$("tech").hidden=false}
function steps(st){$("steps").innerHTML=st.length?st.map(([h,b],i)=>`<div class="step${i===st.length-1?" last":""}"><i>${i+1}</i><div><strong>${esc(h)}</strong>${b}</div></div>`).join(""):`<div class="empty">${esc(t("text.why_empty"))}</div>`}
function resetPanel(){if(selEl)selEl.classList.remove("sel");selEl=null;steps([]);$("tech").hidden=true}
function i18n(){document.documentElement.lang=lang;document.title=`${t("text.title")} · Bank Company`;
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll("[data-tp]").forEach(e=>e.placeholder=t(e.dataset.tp))}

const isAnalyst=u=>u&&u.scopes.includes("handoff:read");
// El país de la persona es donde abrió su cuenta, no donde está (docs/test-users.md).
const fill=(str,o)=>str.replace(/\{(\w+)\}/g,(_,k)=>o[k]??"");
function persona(u){const p=t("personas."+u.key);return typeof p==="object"?p:{label:u.key,desc:""}}
function personaLabel(u){const p=persona(u);
 return isAnalyst(u)||!u.country?p.label:`${fill(t("text.account_in"),{country:ctryName(u.country)})} · ${p.label}`}
function card(u){const p=persona(u),b=document.createElement("button");b.type="button";b.className="pcard";
 const head=isAnalyst(u)||!u.country?p.label:fill(t("text.account_in"),{country:ctryName(u.country)});
 b.innerHTML=`<b>${esc(head)}</b>${!isAnalyst(u)&&u.country?`<span class="tag t-info">${esc(p.label)}</span>`:""}`+
  (p.desc?`<span class="d">${esc(p.desc)}</span>`:"")+(isAnalyst(u)?"":`<span class="l">${esc(fill(t("text.writes_in"),{lang:t("lang_names."+langOf(u.locale))}))}</span>`);
 b.onclick=()=>login(u.key);return b}
function show(view){const chat=view==="chat",an=view==="analyst",pk=view==="picker";
 $("picker").hidden=!pk;$("current").hidden=pk;$("side").style.display=pk?"none":"flex";
 $("chat").style.display=chat?"flex":"none";$("analyst").style.display=an?"flex":"none"}
function showPicker(){cur=null;tok=null;conv=null;pending=null;lang=langOf(navigator.language);i18n();
 $("loading").hidden=true;$("pcards").innerHTML="";$("acards").innerHTML="";
 for(const u of META.users)(isAnalyst(u)?$("acards"):$("pcards")).appendChild(card(u));
 $("acards").previousElementSibling.hidden=!$("acards").children.length;
 try{history.replaceState(null,"",location.pathname)}catch(e){}
 show("picker")}
// Sugerencias con {name:<product_type>} y {amount:<product_type>}: nombre y un monto dentro del rango del producto del país del cliente.
function renderSugg(u){$("sugg").innerHTML="";const byType=ty=>Object.values(META.products).find(p=>p.country===u.country&&p.type===ty);
 for(const tpl of t("suggestions")){let ok=true;
  const s=tpl.replace(/\{(name|amount):([a-z_]+)\}/g,(_,k,ty)=>{const p=byType(ty);if(!p){ok=false;return""}
   if(k==="name"){const n=p.name[lang]||p.name[UI.default_lang];return n.charAt(0).toLowerCase()+n.slice(1)}
   return String(Math.min(p.amount_max,p.amount_min*10))});
  if(!ok)continue;const c=document.createElement("button");c.type="button";c.className="sg";c.textContent=s;c.onclick=()=>send(s);$("sugg").appendChild(c)}}
function renderCases(){$("cases").innerHTML="";for(const c of cases){const b=document.createElement("button");b.type="button";b.className="pill";b.textContent=c;b.onclick=()=>{$("case").value=c;openCase(c)};$("cases").appendChild(b)}}

async function login(k){cur=k;conv=null;pending=null;consent=null;tok=null;$("log").innerHTML="";$("hand").innerHTML="";
 try{history.replaceState(null,"",`${location.pathname}?user=${encodeURIComponent(k)}`)}catch(e){}
 const u=META.users.find(x=>x.key===k)||{key:k,scopes:[],locale:""};
 const [r,j]=await call("/session",{method:"POST",body:JSON.stringify({user:k})});
 lang=langOf(j.locale||u.locale);i18n();$("curLabel").textContent=personaLabel(u);resetPanel();
 if(!r.ok){show("chat");add("bot stop",`${tag("error")}<div class="txt">${esc(t("text.no_session"))} (${r.status}).</div>`);return}
 tok=j.token;const a=(j.scopes||u.scopes).includes("handoff:read");show(a?"analyst":"chat");
 if(a){renderCases();$("whyTitle").textContent=t("analyst.panel_title");steps(t("analyst.panel").map(([h,b])=>[h,`<span>${esc(b)}</span>`]));return}
 renderSugg(u);add("hello",`<h1>${esc(t("text.hello"))}</h1><p>${esc(t("text.hello_sub"))}</p>`)}

async function send(text){if(!text||!tok)return;add("me",esc(text));const ty=add("typing",esc(t("text.thinking")));
 const [r,j]=await call("/chat",{method:"POST",body:JSON.stringify({message:text,conversation_id:conv})});ty.remove();
 if(!r.ok){add("bot stop",`${tag("error")}<div class="txt">${esc(j.error||t("text.no_reply"))} (${r.status})</div>`);return}
 conv=j.conversation_id||conv;pending=j.action_id||null;
 const d=renderBot(j);
 if(pending){const a=document.createElement("div");a.className="acts";a.innerHTML=`<button type="button" class="btn pri">${esc(t("text.yes"))}</button><button type="button" class="btn sec">${esc(t("text.no"))}</button>`;
  const [y,n]=a.querySelectorAll("button");y.onclick=()=>{a.remove();confirmAct(true)};n.onclick=()=>{a.remove();confirmAct(false)};d.insertBefore(a,d.querySelector(".why"))}}

async function confirmAct(ok){add("me",esc(ok?t("text.yes"):t("text.no")));const ty=add("typing",esc(t("text.scoring")));
 const [r,j]=await call("/chat/confirm",{method:"POST",body:JSON.stringify({action_id:pending,confirmed:ok,conversation_id:conv})});ty.remove();pending=null;
 if(!r.ok){add("bot stop",`${tag("error")}<div class="txt">${esc(j.error||"")} (${r.status})</div>`);return}
 consent=ok;renderBot(j)}

// Campos de contracts/handoff.schema.json: verified_facts {fact, source}, actions_taken {tool, result, verified}.
const item=x=>typeof x==="string"?x:x.fact?`${x.fact}${x.source?" · "+srcLabel(x.source):""}`:x.tool?`${srcLabel(x.tool)}: ${x.result??""}`:x.id?srcLabel(x.id):JSON.stringify(x);
const li=a=>a&&a.length?`<ul>${a.map(x=>`<li>${esc(item(x))}</li>`).join("")}</ul>`:"—";
async function openCase(id){const [r,j]=await call("/handoff/"+encodeURIComponent(id));const F=k=>esc(t("analyst.fields."+k));
 if(!r.ok){$("hand").innerHTML=`<div class="hand"><span class="tag t-stop">${esc(r.status===404?t("analyst.not_found"):t("text.error")+" "+r.status)}</span><div>${esc(j.error||"")}</div></div>`;return}
 const rc=j.reason_code,rl=rc&&t("reasons."+rc)!=="reasons."+rc?t("reasons."+rc):(rc||t("analyst.escalated"));
 $("hand").innerHTML=`<div class="hand"><span class="tag t-warn" title="${esc(rc||"")}">${esc(rl)}</span><dl>
  <dt>${F("case")}</dt><dd style="font-family:var(--mono)">${esc(j.case_id)}</dd><dt>${F("customer")}</dt><dd>${esc(j.customer_id)} · ${esc(j.locale)}</dd>
  <dt>${F("request")}</dt><dd>${esc(j.request_summary)}</dd><dt>${F("facts")}</dt><dd>${li(j.verified_facts)}</dd><dt>${F("actions")}</dt><dd>${li(j.actions_taken)}</dd>
  <dt>${F("evidence")}</dt><dd>${li(j.evidence)}</dd><dt>${F("questions")}</dt><dd>${li(j.open_questions)}</dd><dt>${F("risks")}</dt><dd>${li(j.risk_flags)}</dd></dl>
  <details class="tech"><summary>${esc(t("analyst.raw"))}</summary><pre>${esc(JSON.stringify(j,null,2))}</pre></details></div>`}

$("change").onclick=showPicker;
$("f").onsubmit=e=>{e.preventDefault();const v=$("m").value.trim();$("m").value="";send(v)};
$("hf").onsubmit=e=>{e.preventDefault();const id=$("case").value.trim();if(id)openCase(id)};
function setHealth(cls,key){const h=$("health");h.className=cls;h.querySelector("span").textContent=t(key)}
// Arranque: textos (estáticos, mismo origen) y luego /meta. En frío la Function tarda: reintenta cada 10 s.
async function boot(){
 try{UI=await (await fetch("ui.json",{cache:"no-cache"})).json()}catch(e){UI={default_lang:"es",lang:{es:{}}}}
 lang=langOf(navigator.language);i18n();resetPanel();$("loading").textContent=t("text.connecting");
 const [r,m]=await call("/meta");
 if(!r.ok||!Array.isArray(m.users)){setHealth("down","text.starting");$("loading").textContent=t("text.starting");setTimeout(boot,10000);return}
 META=m;const hr=await fetch(API+"/healthz").catch(()=>null);setHealth(hr&&hr.ok?"up":"slow",hr&&hr.ok?"text.online":"text.degraded");
 // ?user=<clave> abre ese cliente directo (enlaces para la demo); si no, primero se elige.
 const q=new URLSearchParams(location.search).get("user");if(META.users.some(u=>u.key===q))login(q);else showPicker()}
boot();
</script>
