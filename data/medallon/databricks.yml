# Asset Bundle del medallón (ADR-20, ADR-22, ADR-23) · owner: datos
# Lo despliega .github/workflows/bundles.yml: validate en PR, deploy en main con target `prod`.
bundle:
  name: fh26-medallon

variables:
  catalog:
    description: Catálogo de Unity Catalog (contracts/gold.yaml).
    default: hackathon
  landing:
    description: Ruta de la copia del dataset en ADLS (ADR-20).
    default: abfss://landing@adlsagentbankdev.dfs.core.windows.net/factored-datathon/data

include:
  - resources/*.yml

targets:
  # Para correr desde una laptop contra el workspace, sin tocar lo de producción.
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405618141733267.7.azuredatabricks.net

  # Lo que despliega CI desde main. run_as = sp-pipelines (X2, ADR-20).
  prod:
    mode: production
    workspace:
      host: https://adb-7405618141733267.7.azuredatabricks.net
      # Fuera de /Workspace/Shared a propósito: esa ruta es escribible por todo el workspace a nivel
      # de filesystem, al margen de los permisos del bundle, y este código corre como sp-pipelines
      # (ALL PRIVILEGES en 5 esquemas, lee cosmos-key). Se fija a la carpeta de sp-pipelines y no a
      # la de quien despliega, para que CI y una corrida manual escriban la misma copia (revisión de #28).
      root_path: /Workspace/Users/0bad9ec7-e458-4fe0-8043-50b7847dd194/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: 0bad9ec7-e458-4fe0-8043-50b7847dd194   # sp-pipelines
    permissions:
      # Quien pueda editar este bundle edita código que corre como sp-pipelines, que tiene
      # ALL PRIVILEGES en 5 esquemas y lee cosmos-key del scope fh26. Por eso CAN_MANAGE es solo
      # para el SP y para datos, y el resto del workspace ve sin poder tocar (revisión de #28).
      - service_principal_name: 0bad9ec7-e458-4fe0-8043-50b7847dd194 # sp-pipelines
        level: CAN_MANAGE
      - user_name: yovera.eladio@hotmail.com
        level: CAN_MANAGE
      - group_name: users
        level: CAN_VIEW
